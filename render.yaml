services:
  - type: web
    name: tots-blog-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
